<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Bank Marketing Data Analysis</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #333;
    text-align: center;
}

.container {
    width: 90%;
    max-width: 1100px;
    margin: auto;
    padding: 20px 0;
}

.glass-btn {
    display: inline-block;
    padding: 10px 20px;
    font-size: 16px;
    text-decoration: none;
    color: #222;
    border-radius: 10px;
    background: rgba(255,255,255,0.35);
    border: 1px solid rgba(255,255,255,0.4);
    backdrop-filter: blur(10px);
    box-shadow: 0 4px 15px rgba(0,0,0,0.15);
    transition: 0.3s;
    margin-bottom: 15px;
}

.glass-btn:hover {
    background: rgba(255,255,255,0.55);
}

h1 {
    font-size: 32px;
    margin-bottom: 25px;
    color: #3b2370;
}

/* GRID */
.image-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
    gap: 25px;
}

/* IMAGE CARD */
.img-box {
    position: relative;
    overflow: hidden;
    border-radius: 12px;
}

.img-box img {
    width: 100%;
    height: 220px;
    object-fit: cover;
    display: block;
    border-radius: 12px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
}

/* HOVER OVERLAY */
.overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.55);
    display: flex;
    justify-content: center;
    align-items: center;
    opacity: 0;
    transition: 0.3s ease;
}

.img-box:hover .overlay {
    opacity: 1;
}

/* VIEW FULL IMAGE BUTTON */
.view-btn {
    padding: 10px 18px;
    font-size: 15px;
    border-radius: 10px;
    border: none;
    background: rgba(255,255,255,0.9);
    color: #222;
    cursor: pointer;
    font-weight: 600;
    transition: 0.3s;
}

.view-btn:hover {
    background: white;
}

/* LIGHTBOX */
#lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.9);
    z-index: 1000;
    justify-content: center;
    align-items: center;
    flex-direction: column;
}

#lightbox img {
    max-width: 92vw;
    max-height: 85vh;
    object-fit: contain;
    border-radius: 10px;
}

#caption {
    color: #fff;
    margin-top: 15px;
    font-size: 18px;
    max-width: 80%;
}

.close-btn {
    position: absolute;
    top: 30px;
    right: 40px;
    font-size: 40px;
    color: white;
    cursor: pointer;
}

.nav-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 45px;
    color: white;
    cursor: pointer;
    user-select: none;
}

.prev-btn { left: 40px; }
.next-btn { right: 40px; }
</style>
</head>

<body>

<div class="container">
    <a href="index.html#projects" class="glass-btn">⬅ Back</a>
    <h1>Bank Marketing Data Analysis</h1>

    <div class="image-grid">

        <div class="img-box">
            <img src="assets/Bn1.png">
            <div class="overlay">
                <button class="view-btn" onclick="openLightbox(0)">View Full Image</button>
            </div>
        </div>

        <div class="img-box">
            <img src="assets/Bn2.png">
            <div class="overlay">
                <button class="view-btn" onclick="openLightbox(1)">View Full Image</button>
            </div>
        </div>

        <div class="img-box">
            <img src="assets/Bn3.png">
            <div class="overlay">
                <button class="view-btn" onclick="openLightbox(2)">View Full Image</button>
            </div>
        </div>

        <div class="img-box">
            <img src="assets/Bn4.png">
            <div class="overlay">
                <button class="view-btn" onclick="openLightbox(3)">View Full Image</button>
            </div>
        </div>

        
    </div>
</div>

<!-- LIGHTBOX -->
<div id="lightbox">
    <span class="close-btn" onclick="closeLightbox()">×</span>
    <span class="nav-btn prev-btn" onclick="changeImage(-1)">⟨</span>
    <img id="lightbox-img">
    <span class="nav-btn next-btn" onclick="changeImage(1)">⟩</span>
    <div id="caption"></div>
</div>

<script>
const images = [
    "assets/Bn1.png",
    "assets/Bn2.png",
    "assets/Bn3.png",
    "assets/Bn4.png"
];

const descriptions = [
    "Term deposit subscription count showing the distribution between subscribed and non-subscribed customers, highlighting overall conversion imbalance.",

    "Job-wise analysis comparing term deposit subscriptions across different professions and identifying roles with higher conversion rates.",

    "Education-level analysis showing that customers with higher education levels have a greater likelihood of subscribing to term deposits.",

    "Age distribution of customers indicating that middle-aged clients form the primary segment of term deposit subscribers."
];

let currentIndex = 0;

function openLightbox(index) {
    currentIndex = index;
    document.getElementById("lightbox-img").src = images[index];
    document.getElementById("caption").textContent = descriptions[index];
    document.getElementById("lightbox").style.display = "flex";
}

function closeLightbox() {
    document.getElementById("lightbox").style.display = "none";
}

function changeImage(direction) {
    currentIndex = (currentIndex + direction + images.length) % images.length;
    document.getElementById("lightbox-img").src = images[currentIndex];
    document.getElementById("caption").textContent = descriptions[currentIndex];
}
</script>

</body>
</html>
